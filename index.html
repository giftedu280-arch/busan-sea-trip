    <style>
:root {
  --navy: #082a4a;
  --blue: #087a9d;
  --deep-blue: #075f82;
  --sky: #49bfd1;
  --aqua: #c9f0ed;
  --foam: #eefaf8;
  --sand: #fff4d8;
  --coral: #ff725e;
  --ink: #17324a;
  --muted: #64798a;
  --line: #d7e8ea;
  --white: #ffffff;
  --shadow: 0 20px 60px rgba(7, 77, 101, 0.13);
  --soft-shadow: 0 10px 30px rgba(7, 77, 101, 0.09);
  --radius-large: 30px;
  --radius-medium: 20px;
  --radius-small: 14px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 8% 20%, rgba(97, 211, 211, 0.2), transparent 25rem),
    linear-gradient(180deg, #f7fffd 0%, #edf9f8 45%, #ffffff 100%);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  line-height: 1.6;
}

button,
input,
select {
  font: inherit;
}

button,
label {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(255, 114, 94, 0.45);
  outline-offset: 3px;
}

.sea-glow {
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  filter: blur(5px);
  pointer-events: none;
}

.sea-glow-one {
  top: 42%;
  right: -10rem;
  width: 28rem;
  height: 28rem;
  background: rgba(53, 177, 197, 0.08);
}

.sea-glow-two {
  bottom: 4%;
  left: -9rem;
  width: 22rem;
  height: 22rem;
  background: rgba(255, 214, 119, 0.12);
}

.site-header {
  width: min(1160px, calc(100% - 40px));
  margin: 0 auto;
  padding: 24px 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #b4140c;
  font-size: 1.28rem;
  font-weight: 900;
  letter-spacing: -0.055em;
  text-decoration: none;
  text-shadow: 0 1px 0 #ffd3a2, 0 3px 8px rgba(210, 34, 15, 0.22);
}

.brand-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 16px 16px 20px 20px;
  background: linear-gradient(155deg, #ffdf52 0 28%, #ff5a1f 50%, #a90f09 100%);
  color: white;
  font-size: 1.42rem;
  line-height: 1;
  box-shadow: 0 8px 18px rgba(218, 43, 16, 0.32), inset 0 1px 3px rgba(255, 255, 255, 0.6);
  animation: flame-pulse 1.8s ease-in-out infinite;
}

@keyframes flame-pulse {
  0%, 100% { transform: translateY(0) rotate(-2deg); filter: saturate(1); }
  50% { transform: translateY(-2px) rotate(2deg); filter: saturate(1.25) drop-shadow(0 2px 5px rgba(255, 75, 20, 0.45)); }
}

.header-note {
  margin: 0;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

main {
  width: min(1160px, calc(100% - 40px));
  margin: 0 auto;
}

.hero {
  min-height: 435px;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: 50px;
  padding: 40px 6px 50px;
}

.eyebrow,
.section-number {
  margin: 0 0 10px;
  color: var(--blue);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.hero h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(2.8rem, 5.7vw, 5.2rem);
  font-weight: 900;
  letter-spacing: -0.065em;
  line-height: 1.08;
}

.hero h1 span {
  color: var(--blue);
}

.hero-description {
  margin: 24px 0 20px;
  color: #536f81;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}

.hero-points {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hero-points span {
  padding: 7px 12px;
  border: 1px solid rgba(8, 122, 157, 0.16);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
  color: var(--blue);
  font-size: 0.78rem;
  font-weight: 800;
}

.hero-points span::before {
  content: "‚úì";
  margin-right: 6px;
  color: var(--coral);
}

.hero-visual {
  position: relative;
  min-height: 335px;
  overflow: hidden;
  border-radius: 52% 48% 46% 54% / 42% 38% 62% 58%;
  background: linear-gradient(180deg, #c5f0ed 0 52%, #51bdcc 52% 66%, #0c789b 66% 100%);
  box-shadow: 0 35px 80px rgba(7, 94, 124, 0.2);
}
